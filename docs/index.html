<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Strategy Performance - Trading Results</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .nav-link {
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .period-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .period-btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            color: white;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .period-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .period-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-value.positive {
            color: #10b981;
        }
        
        .stat-value.negative {
            color: #ef4444;
        }
        
        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .chart-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        
        canvas {
            max-height: 400px;
        }
        
        .trade-list {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 500px;
            overflow-y: auto;
        }
        
        .trade-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 100px 100px 100px 1fr auto;
            gap: 15px;
            align-items: center;
        }
        
        .trade-item:last-child {
            border-bottom: none;
        }
        
        .trade-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .trade-badge.sniper {
            background: #fef3c7;
            color: #92400e;
        }
        
        .trade-badge.background {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .trade-badge.win {
            background: #d1fae5;
            color: #065f46;
        }
        
        .trade-badge.loss {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 40px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Dual Strategy Performance</h1>
        <div class="subtitle">Sniper + Background Trading System</div>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link">📊 Dual Strategy Demo</a>
            <a href="leveraged.html" class="nav-link">💰 $1K Leveraged (50:1)</a>
        </div>
        
        <div class="period-selector">
            <button class="period-btn active" onclick="selectPeriod('3months')">3 Months</button>
            <button class="period-btn" onclick="selectPeriod('6months')">6 Months</button>
            <button class="period-btn" onclick="selectPeriod('1year')">1 Year</button>
        </div>
        
        <div class="stats-grid" id="stats-grid">
            <!-- Stats will be populated by JavaScript -->
        </div>
        
        <div class="chart-container">
            <div class="chart-title">📈 Equity Curve</div>
            <canvas id="equityChart"></canvas>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">📉 Drawdown Chart</div>
            <canvas id="drawdownChart"></canvas>
        </div>
        
        <div class="trade-list">
            <div class="chart-title">📋 Recent Trades</div>
            <div id="trade-list-content">
                <!-- Trades will be populated by JavaScript -->
            </div>
        </div>
        
        <div class="footer">
            <p>💎 Dual Strategy System | Powered by Quantitative Analysis</p>
            <p style="margin-top: 10px; font-size: 0.9em;">
                Sniper: 40% allocation, 5% risk | Background: 60% allocation, 2% risk
            </p>
        </div>
    </div>
    
    <script>
        let data = {};
        let currentPeriod = '3months';
        let equityChart = null;
        let drawdownChart = null;
        
        // Load data
        fetch('data.json')
            .then(response => response.json())
            .then(jsonData => {
                data = jsonData;
                updateDashboard();
            })
            .catch(error => console.error('Error loading data:', error));
        
        function selectPeriod(period) {
            currentPeriod = period;
            
            // Update button states
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            updateDashboard();
        }
        
        function updateDashboard() {
            const periodData = data[currentPeriod];
            if (!periodData) return;
            
            // Update stats
            updateStats(periodData);
            
            // Update charts
            updateEquityChart(periodData);
            updateDrawdownChart(periodData);
            
            // Update trade list
            updateTradeList(periodData);
        }
        
        function updateStats(periodData) {
            const profit = periodData.ending_balance - periodData.starting_balance;
            const profitPct = periodData.total_return;
            
            const statsHTML = `
                <div class="stat-card">
                    <div class="stat-label">Starting Balance</div>
                    <div class="stat-value">$${periodData.starting_balance.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Ending Balance</div>
                    <div class="stat-value positive">$${periodData.ending_balance.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Profit</div>
                    <div class="stat-value positive">$${profit.toLocaleString(undefined, {maximumFractionDigits: 0})}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Return %</div>
                    <div class="stat-value positive">+${profitPct.toFixed(2)}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Max Drawdown</div>
                    <div class="stat-value negative">${periodData.max_drawdown.toFixed(2)}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Trades</div>
                    <div class="stat-value">${periodData.total_trades}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Sniper Trades</div>
                    <div class="stat-value">${periodData.sniper_trades}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Background Trades</div>
                    <div class="stat-value">${periodData.background_trades}</div>
                </div>
            `;
            
            document.getElementById('stats-grid').innerHTML = statsHTML;
        }
        
        function updateEquityChart(periodData) {
            const ctx = document.getElementById('equityChart');
            
            if (equityChart) {
                equityChart.destroy();
            }
            
            const labels = periodData.equity_curve.map(p => p.date);
            const equityData = periodData.equity_curve.map(p => p.equity);
            const peakData = periodData.equity_curve.map(p => p.peak);
            
            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Equity',
                        data: equityData,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }, {
                        label: 'Peak',
                        data: peakData,
                        borderColor: '#667eea',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': $' + context.parsed.y.toLocaleString(undefined, {maximumFractionDigits: 0});
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxTicksLimit: 10
                            }
                        }
                    }
                }
            });
        }
        
        function updateDrawdownChart(periodData) {
            const ctx = document.getElementById('drawdownChart');
            
            if (drawdownChart) {
                drawdownChart.destroy();
            }
            
            const labels = periodData.equity_curve.map(p => p.date);
            const drawdownData = periodData.equity_curve.map(p => -p.drawdown);
            
            drawdownChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Drawdown',
                        data: drawdownData,
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return 'Drawdown: ' + Math.abs(context.parsed.y).toFixed(2) + '%';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 0,
                            ticks: {
                                callback: function(value) {
                                    return Math.abs(value) + '%';
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxTicksLimit: 10
                            }
                        }
                    }
                }
            });
        }
        
        function updateTradeList(periodData) {
            const trades = periodData.trades.slice(-20).reverse(); // Last 20 trades
            
            const tradesHTML = trades.map(trade => `
                <div class="trade-item">
                    <div class="trade-badge ${trade.strategy}">${trade.strategy.toUpperCase()}</div>
                    <div class="trade-badge ${trade.won ? 'win' : 'loss'}">${trade.won ? 'WIN' : 'LOSS'}</div>
                    <div style="color: ${trade.pnl >= 0 ? '#10b981' : '#ef4444'}; font-weight: 600;">
                        ${trade.pnl >= 0 ? '+' : ''}$${trade.pnl.toFixed(0)}
                    </div>
                    <div style="color: #666;">${trade.date}</div>
                    <div style="text-align: right; color: #333; font-weight: 600;">
                        $${trade.equity_after.toLocaleString(undefined, {maximumFractionDigits: 0})}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('trade-list-content').innerHTML = tradesHTML || '<p style="text-align: center; color: #999;">No trades available</p>';
        }
    </script>
</body>
</html>
